<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SevenPens Tablet Tester Basic</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body oncontextmenu="return false;">

<div id="toolbar">
    <button onclick="clearCanvas()">Clear</button>
    <span class="info-item">Mode:
        <select id="mode">
            <option value="pressure-size">Pressure to Size</option>
            <option value="azimuth-rotation">Tilt Azimuth to Brush rotation</option>
            <option value="altitude-size">Tilt Altitude to Brush size</option>
            <option value="twist-rotation">Twist to Brush rotation</option>
            <option value="pointer-only">Pointer only (no drawing)</option>
        </select>
    </span>
    <span class="info-item">Type: <span id="val-type" class="val">---</span></span>
    <span class="info-item">Pressure: <span id="val-pressure" class="val">---</span></span>
    <span class="info-item">Tilt X: <span id="val-tiltX" class="val">---</span></span>
    <span class="info-item">Tilt Y: <span id="val-tiltY" class="val">---</span></span>
    <span class="info-item">Azimuth: <span id="val-azimuth" class="val">---</span></span>
    <span class="info-item">Altitude: <span id="val-altitude" class="val">---</span></span>
    <span class="info-item">Twist: <span id="val-twist" class="val">---</span></span>
    <button id="about-btn" type="button">About</button>
</div>

<dialog id="about-dialog">
    <h2>SevenPens Tablet Tester</h2>
    <p>A simple online tool for exploring and troubleshooting digital pen behavior via the Pointer Events API.</p>
    <ul>
        <li><a href="https://github.com/TheSevenPens/WebTabletTesterBasic" target="_blank" rel="noopener">Code</a> on GitHub</li>
        <li><a href="https://github.com/TheSevenPens/WebTabletTesterBasic/blob/main/USERMANUAL.md" target="_blank" rel="noopener">Docs</a> (User Manual)</li>
    </ul>
    <form method="dialog">
        <button type="submit">Close</button>
    </form>
</dialog>

<canvas id="canvas"></canvas>
<svg id="cursor-indicator" hidden width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
    <g stroke="#d12d2d" stroke-width="2" fill="none">
        <line x1="0"  y1="16" x2="12" y2="16"/>
        <line x1="20" y1="16" x2="32" y2="16"/>
        <line x1="16" y1="0"  x2="16" y2="12"/>
        <line x1="16" y1="20" x2="16" y2="32"/>
    </g>
    <circle cx="16" cy="16" r="1.5" fill="#d12d2d"/>
</svg>

<script src="app.js"></script>
</body>
</html>
